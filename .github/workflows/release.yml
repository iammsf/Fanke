name: release

# 仓库只保留一个 latest Release:每次构建覆盖同名产物,不再打 v1.2.3 标签。
# 版本号用构建时间戳(如 202611150235),仅用于比较新旧,不作发布名。
#
# 触发:
#   - push 到 main 且改动 backend/ 或 frontend-nuxt/
#   - Actions 页面手动 Run workflow(插件/主题单独发版时用)
#
# 注意:仓库 Settings → Actions → General 需允许 Workflow permissions 为
# "Read and write permissions";若 main 有分支保护,请放行 github-actions[bot]。

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend-nuxt/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算构建版本号
        run: echo "VERSION=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            extensions/s3-storage/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-nuxt/package-lock.json

      - name: 构建前端
        working-directory: frontend-nuxt
        run: |
          npm ci --no-audit --no-fund
          NUXT_TELEMETRY_DISABLED=1 NUXT_PUBLIC_API_BASE=/api/v1 npm run build

      - name: 构建后端并打包本体
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            staging="dist/fanke-linux-${arch}"
            mkdir -p "$staging/bin" "$staging/web"
            ( cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
                -trimpath -buildvcs=false \
                -ldflags "-s -w -X fanke/backend/internal/buildinfo.Version=${VERSION}" \
                -o "../${staging}/bin/api" ./cmd/api )
            # 本体只含 bin/api 与前端静态文件,不含 extensions/ 插件目录
            cp -a frontend-nuxt/.output/public/. "$staging/web/"
            tar -C dist -czf "dist/fanke-linux-${arch}.tar.gz" "$(basename "$staging")"
            rm -rf "$staging"
          done

      - name: 构建插件与主题包
        run: |
          set -euo pipefail
          for dir in extensions/*/; do
            slug="$(basename "$dir")"
            [ -f "$dir/info.json" ] || continue
            if [ -f "$dir/go.mod" ] && [ -d "$dir/server" ]; then
              for arch in amd64 arm64; do
                ( cd "$dir" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
                    -trimpath -buildvcs=false -ldflags "-s -w" \
                    -o "server/bin/linux-$arch/$slug-server" ./server )
              done
            fi
            ( cd "$dir" && zip -qr "../../dist/$slug.zip" . )
          done
          for dir in themes/*/; do
            [ -d "$dir" ] || continue
            slug="$(basename "$dir")"
            [ -f "$dir/info.json" ] || continue
            ( cd "$dir" && zip -qr "../../dist/theme-$slug.zip" . )
          done
          ls -lh dist

      - name: 生成更新清单
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import subprocess

          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          base = f'https://github.com/{repo}/releases/latest/download'
          page = f'https://github.com/{repo}/releases/latest'
          date = subprocess.check_output(['date', '-u', '+%Y-%m-%d']).decode().strip()

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()

          archs = ('amd64', 'arm64')
          urls = {a: f'{base}/fanke-linux-{a}.tar.gz' for a in archs}
          sums = {a: sha256_file(f'dist/fanke-linux-{a}.tar.gz') for a in archs}
          core = {
              'version': version,
              'date': date,
              'notes': f'滚动发布,构建号 {version}。',
              'page_url': page,
              'download_url': urls['amd64'],
              'download_urls': urls,
              'sha256': sums['amd64'],
              'sha256s': sums,
          }
          plugins = {}
          for path in sorted(glob.glob('extensions/*/info.json')):
              with open(path, encoding='utf-8') as fh:
                  info = json.load(fh)
              slug = info.get('slug') or os.path.basename(os.path.dirname(path))
              plugins[slug] = {
                  'version': info.get('version', ''),
                  'date': info.get('date', ''),
                  'notes': info.get('description', ''),
                  'page_url': page,
                  'download_url': f'{base}/{slug}.zip',
                  'sha256': sha256_file(f'dist/{slug}.zip'),
              }
          themes = {}
          for path in sorted(glob.glob('themes/*/info.json')):
              with open(path, encoding='utf-8') as fh:
                  info = json.load(fh)
              slug = info.get('slug') or os.path.basename(os.path.dirname(path))
              themes[slug] = {
                  'version': info.get('version', ''),
                  'date': info.get('date', ''),
                  'notes': info.get('description', ''),
                  'page_url': page,
                  'download_url': f'{base}/theme-{slug}.zip',
                  'sha256': sha256_file(f'dist/theme-{slug}.zip'),
              }
          with open('updates.json', 'w', encoding='utf-8') as fh:
              json.dump({'core': core, 'plugins': plugins, 'themes': themes}, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print('已生成 updates.json:', core['version'], list(plugins), list(themes))
          PY

      - name: 清理历史 Release 与 v* 标签
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth="Authorization: Bearer $GH_TOKEN"
          # 只保留 latest,其余 Release 全部删除
          curl -fsS -H "$auth" "$api/releases?per_page=100" \
            | python3 -c "import json,sys;[print(r['id'], r['tag_name']) for r in json.load(sys.stdin)]" > /tmp/rels.txt
          while read -r id tag; do
            [ -n "$id" ] || continue
            [ "$tag" = "latest" ] && continue
            curl -fsS -X DELETE -H "$auth" "$api/releases/$id"
            echo "deleted release $tag"
          done < /tmp/rels.txt
          # 删除 v1.2.3 这类历史标签
          curl -fsS -H "$auth" "$api/git/refs/tags" \
            | python3 -c "import json,sys;[print(r['ref']) for r in json.load(sys.stdin)]" > /tmp/refs.txt
          while read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              refs/tags/v*)
                curl -fsS -X DELETE -H "$auth" "$api/git/refs/${ref#refs/}"
                echo "deleted tag $ref"
                ;;
            esac
          done < /tmp/refs.txt

      - name: 发布 latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: |
            滚动发布,构建号 `${{ env.VERSION }}`。产物名称固定,安装/升级始终取最新一次构建。
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            updates.json

      - name: 提交更新清单到 main
        run: |
          set -euo pipefail
          cp updates.json /tmp/updates.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/updates.json updates.json
          if git diff --quiet -- updates.json; then
            echo "更新清单无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "chore: 更新 latest 发布清单"
          # 期间可能有人推了 main,重试几次避免非快进拒绝
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1

      - name: 刷新 jsDelivr 清单缓存
        continue-on-error: true
        run: |
          # 仅在使用 jsDelivr 渠道时需要;GitHub raw 会自行过期
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/updates.json"
